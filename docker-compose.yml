services:

  appseed_app:
    build: .
    container_name: appseed_app
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: appseed_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:  
    image: nginx:alpine
    container_name: appseed_nginx
    ports: 
      - "80:80"
    volumes:
      - ./nginx/appseed-app.conf:/etc/nginx/conf.d/default.conf 
    depends_on: 
      - appseed_app

volumes:
  postgres_data:  


      
      


        

